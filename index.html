<script>
const SHEET_ID="1AAwSwFCGIqS6JGdYTdkSau91BtnM_sMdWl2By5A9nFQ";
const METRICS=["H","HR","RBI","R","SB","SO","BB","TB","2B","DK_FP"];
const P_METRICS=["IP","SO","ER","H","HR","BB","DK_FP","PC","W","L"];
const MLB_API="https://statsapi.mlb.com/api/v1";

let st={
  tonight:[],gameLogs:[],splits:[],weather:[],pitchers:[],schedule:[],
  pTonight:[],pGameLogs:[],pSplits:[],
  picks:[],props:[],
  mode:"batter",
  player:"",metric:"H",line:"",activeTab:"dashboard",oppFilter:"",
  loading:true,error:null,
  picksView:"picks",propsMetric:"ALL",
  streakFilter:"all",drafted:new Set(),
  lkPlayer:null,lkResults:[],lkSubTab:"career",lkPlayerType:"batter",
  lkCareer:null,lkYby:null,lkVsTeamStats:null,lkVsPlayerId:null,
  lkVsPlayerName:"",lkVsPlayerResults:[],lkVsPlayerStats:null,
  lkVsTeamId:null,lkLoading:{},lkTeamList:[]
};

// ═══════════════════════════════════════════
// 🛡️ BULLETPROOF MATH HELPERS
// ═══════════════════════════════════════════
const toNum = v => {
    if (v === null || v === undefined || v === "") return 0;
    const n = parseFloat(v);
    return isNaN(n) ? 0 : n;
};

// Safely grabs a stat, checking for 'Seas_', 'Season_', or exact match
const safeGet = (obj, key) => {
    if (!obj) return 0;
    return toNum(obj[`Seas_${key}`] || obj[`Season_${key}`] || obj[key]);
};

function cleanRows(rows){
  if(!rows||!rows.length)return [];
  return rows.map(row=>{
    const clean={};
    for(const[k,v] of Object.entries(row)){
      const ck=k.replace(/^\uFEFF/,'').replace(/[\u200B-\u200D\uFEFF]/g,'').trim();
      clean[ck]=v;
    }
    return clean;
  });
}

const barColor=(v,l)=>!l?"#4ade80":v>l?"#22c55e":"#ef4444";
const avgColor=(v,l)=>!l?"#4ade80":v>=l?"#4ade80":"#f97316";
const esc=s=>{if(!s)return"";return String(s).replace(/[&<>'"]/g,t=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[t]))};
const fmtOdds=v=>{if(!v&&v!==0)return"—";v=parseInt(v);return v>0?`+${v}`:`${v}`};

function hasLogs(name,isP){return(isP?st.pGameLogs:st.gameLogs).some(g=>g.player_name===name)}
function getProps(name){if(!name||!st.props.length)return[];const n=name.toLowerCase();return st.props.filter(p=>(p.PLAYER_NAME||"").toLowerCase()===n)}
function getPick(name){if(!name||!st.picks.length)return null;const n=name.toLowerCase();return st.picks.find(p=>(p.player||"").toLowerCase()===n)||null}

function firstValidPlayer(arr){
  if(!arr||!arr.length)return "";
  for(let i=0;i<Math.min(arr.length,30);i++){
    const n=arr[i]?.player_name;
    if(n&&String(n).trim().length>1)return String(n).trim();
  }
  return "";
}

let useProxy=false;
async function mlbFetch(url){
  try{const r=await fetch(url);if(!r.ok)throw new Error(r.status);return r.json()}
  catch(e){if(!useProxy){useProxy=true;return(await fetch("https://corsproxy.io/?"+encodeURIComponent(url))).json()}throw e}
}

function getDraftBoard(){
  const board=[];
  const aiMap=new Map();
  st.picks.forEach(p=>{if(p.player)aiMap.set(p.player.toLowerCase(),p)});

  // BATTERS
  for(const p of st.tonight){
    const name=p.player_name;if(!name)continue;
    const logs=st.gameLogs.filter(g=>g.player_name===name).sort((a,b)=>(b.game_date||"").localeCompare(a.game_date||""));
    const most=logs[0]||{};

    const sH=safeGet(most,'H'), sHR=safeGet(most,'HR'), s2B=safeGet(most,'2B');
    const sTB=safeGet(most,'TB'), sRBI=safeGet(most,'RBI'), sR=safeGet(most,'R');
    const sSB=safeGet(most,'SB'), sBB=safeGet(most,'BB'), sHBP=safeGet(most,'HBP');

    const s3B=Math.max(0,(sTB-sH-s2B-3*sHR)/2) || 0;
    const s1B=Math.max(0,sH-s2B-s3B-sHR) || 0;
    const calcUD=(s1B*3+s2B*6+s3B*8+sHR*10+sBB*3+sHBP*3+sRBI*2+sR*2+sSB*4) || 0;
    const projUD=safeGet(most, 'UD_FP') || calcUD;

    const l7H=toNum(most.L7_H), l7HR=toNum(most.L7_HR), l72B=toNum(most.L7_2B);
    const l7TB=toNum(most.L7_TB), l7RBI=toNum(most.L7_RBI), l7R=toNum(most.L7_R);
    const l7SB=toNum(most.L7_SB), l7BB=toNum(most.L7_BB), l7HBP=toNum(most.L7_HBP);
    const l73B=Math.max(0,(l7TB-l7H-l72B-3*l7HR)/2) || 0;
    const l71B=Math.max(0,l7H-l72B-l73B-l7HR) || 0;
    const calcL7=(l71B*3+l72B*6+l73B*8+l7HR*10+l7BB*3+l7HBP*3+l7RBI*2+l7R*2+l7SB*4) || 0;
    const l7UD=toNum(most.L7_UD_FP) || calcL7;

    const aiPick=aiMap.get(name.toLowerCase());
    const isSmash=aiPick&&(aiPick.confidence||"").toUpperCase()==="SMASH";

    let pos="FLEX";
    const posRaw=(p.position||"").toUpperCase();
    if(posRaw.includes("C")||posRaw.includes("1B")||posRaw.includes("2B")||posRaw.includes("3B")||posRaw.includes("SS"))pos="IF";
    else if(posRaw.includes("OF")||posRaw.includes("LF")||posRaw.includes("CF")||posRaw.includes("RF"))pos="OF";

    board.push({
      name,team:p.team_abbr||"",opp:p.opp_abbr_tonight||"",pitcher:p.opp_pitcher_name||"TBD",hand:p.opp_pitcher_hand||"?",
      projUD:projUD.toFixed(1),l7UD:l7UD.toFixed(1),
      sH,sHR,sRBI,sR,sSB,sBB,isSmash,isPitcher:false,pos
    });
  }

  // PITCHERS
  for(const p of st.pTonight){
    const name=p.player_name;if(!name)continue;
    const logs=st.pGameLogs.filter(g=>g.player_name===name).sort((a,b)=>(b.game_date||"").localeCompare(a.game_date||""));
    const most=logs[0]||{};

    const sSO=safeGet(most,'SO'), sER=safeGet(most,'ER'), sW=safeGet(most,'W'), sIP=safeGet(most,'IP');
    const qsGames=logs.filter(g=>toNum(g.IP)>=6&&toNum(g.ER)<=3).length;
    const qsRate=logs.length>0 ? qsGames/logs.length : 0;
    
    const calcUD=(sW*2+qsRate*3+sSO*1+sIP*1+sER*(-1)) || 0;
    const projUD=safeGet(most, 'UD_FP') || calcUD;

    const l3SO=toNum(most.L3_SO), l3ER=toNum(most.L3_ER), l3W=toNum(most.L3_W), l3IP=toNum(most.L3_IP);
    const l3QS=logs.slice(0,3).filter(g=>toNum(g.IP)>=6&&toNum(g.ER)<=3).length / Math.max(1, Math.min(3, logs.length));
    const calcL3=(l3W*2+l3QS*3+l3SO*1+l3IP*1+l3ER*(-1)) || 0;
    const l3UD=toNum(most.L3_UD_FP) || calcL3;

    const aiPick=aiMap.get(name.toLowerCase());
    const isSmash=aiPick&&(aiPick.confidence||"").toUpperCase()==="SMASH";

    board.push({
      name,team:p.team_abbr||"",opp:p.opp_abbr_tonight||"",pitcher:"",hand:"",
      projUD:projUD.toFixed(1),l7UD:l3UD.toFixed(1),
      sSO,sER,sW,sIP,qsRate,isSmash,isPitcher:true,pos:"P"
    });
  }
  return board.sort((a,b)=>parseFloat(b.projUD||0)-parseFloat(a.projUD||0));
}

function getDingerBoard(){
  const rows=[];
  for(const p of st.tonight){
    const name=p.player_name;if(!name)continue;
    const logs = st.gameLogs.filter(g=>g.player_name===name);
    
    const seasHR=safeGet(p, 'HR');
    const l7HR=toNum(p.L7_HR);
    const l14HR=toNum(p.L14_HR);
    
    const seasHRtotal=logs.reduce((s,g)=>s+toNum(g.HR),0);
    const totalAB=logs.reduce((s,g)=>s+toNum(g.AB),0);
    const hrRate=totalAB>0 ? seasHRtotal/totalAB : 0;
    const gamesPlayed=logs.length;
    const hrPerGame=gamesPlayed>0 ? seasHRtotal/gamesPlayed : 0;
    
    const hrProp=st.props.find(pr=>(pr.PLAYER_NAME||"").toLowerCase()===name.toLowerCase()&&pr.METRIC==="HR");
    const dkLine=hrProp?hrProp.DK_LINE:null;
    const overOdds=hrProp?parseInt(hrProp.OVER_ODDS)||null:null;
    
    let score=0;
    score+=hrRate*100; score+=l7HR*15; score+=l14HR*8; score+=seasHR*5; score+=hrPerGame*20;
    if(overOdds&&overOdds<0)score+=10;
    if(overOdds&&overOdds>0&&overOdds<=200)score+=5;
    
    if(totalAB > 0) {
        rows.push({name,team:p.team_abbr||"",opp:p.opp_abbr_tonight||"",pitcher:p.opp_pitcher_name||"TBD",hand:p.opp_pitcher_hand||"?",venue:p.venue_tonight||"",seasHR:seasHRtotal,totalAB,hrRate,hrPerGame,gamesPlayed,l7HR,l14HR,dkLine,overOdds,score: score||0});
    }
  }
  return rows.sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,30);
}

function getStreaks(){
  const streaks=[];
  const BAT_TYPES=[
    {key:"H",threshold:1,label:"Hit Streak",emoji:"🔥",type:"bat",desc:"games w/ a hit"},
    {key:"HR",threshold:1,label:"HR Streak",emoji:"💣",type:"bat",desc:"games w/ a HR"},
    {key:"H",threshold:2,label:"Multi-Hit",emoji:"🔥🔥",type:"bat",desc:"games w/ 2+ hits"},
    {key:"RBI",threshold:1,label:"RBI Streak",emoji:"💰",type:"bat",desc:"games w/ an RBI"},
    {key:"TB",threshold:3,label:"Power Surge",emoji:"⚡",type:"bat",desc:"games w/ 3+ TB"},
    {key:"R",threshold:1,label:"Runs Streak",emoji:"🏃",type:"bat",desc:"games scoring a run"},
    {key:"SB",threshold:1,label:"SB Streak",emoji:"💨",type:"bat",desc:"games w/ a steal"},
  ];

  for(const sType of BAT_TYPES){
    for(const p of st.tonight){
      const name=p.player_name; if(!name) continue;
      const logs=st.gameLogs.filter(g=>g.player_name===name).sort((a,b)=>(b.game_date||"").localeCompare(a.game_date||""));
      if(logs.length<3)continue;
      let streak=0;
      for(const g of logs){
        if(toNum(g[sType.key])>=sType.threshold) streak++; else break;
      }
      if(streak<3)continue;

      const recentVals=logs.slice(0,7).map(g=>toNum(g[sType.key]));
      const avgDuring=logs.slice(0,streak).reduce((s,g)=>s+toNum(g[sType.key]),0)/Math.max(1,streak);
      const seasAvg=safeGet(logs[0], sType.key);
      const prop=st.props.find(pr=>(pr.PLAYER_NAME||"").toLowerCase()===name.toLowerCase()&&pr.METRIC===sType.key);

      streaks.push({
        player:name,team:p.team_abbr||"",opp:p.opp_abbr_tonight||"",pitcher:p.opp_pitcher_name||"TBD",hand:p.opp_pitcher_hand||"?",venue:p.venue_tonight||"",
        stat:sType.key,threshold:sType.threshold,streak,label:sType.label,emoji:sType.emoji,propType:sType.type,desc:sType.desc,
        avgDuring:(avgDuring||0).toFixed(2),seasAvg:(seasAvg||0).toFixed(2),recentVals,dkLine:prop?prop.DK_LINE:null,overOdds:prop?parseInt(prop.OVER_ODDS)||null:null,
      });
    }
  }

  const PIT_TYPES=[
    {key:"SO",threshold:6,label:"K Streak",emoji:"🔥",type:"pitch",desc:"starts w/ 6+ K"},
    {key:"SO",threshold:8,label:"Elite K",emoji:"⚡",type:"pitch",desc:"starts w/ 8+ K"},
    {key:"ER",threshold:2,label:"Lockdown",emoji:"🔒",type:"pitch",compare:"lte",desc:"starts w/ ≤2 ER"},
    {key:"W",threshold:1,label:"Win Streak",emoji:"👑",type:"pitch",desc:"consecutive wins"},
  ];

  for(const sType of PIT_TYPES){
    for(const p of st.pTonight){
      const name=p.player_name; if(!name) continue;
      const logs=st.pGameLogs.filter(g=>g.player_name===name).sort((a,b)=>(b.game_date||"").localeCompare(a.game_date||""));
      if(logs.length<2)continue;
      let streak=0;
      const isLte=sType.compare==="lte";
      for(const g of logs){
        const v=toNum(g[sType.key]);
        if(isLte?v<=sType.threshold:v>=sType.threshold) streak++; else break;
      }
      if(streak<2)continue;

      const recentVals=logs.slice(0,7).map(g=>toNum(g[sType.key]));
      const avgDuring=logs.slice(0,streak).reduce((s,g)=>s+toNum(g[sType.key]),0)/Math.max(1,streak);
      const seasAvg=safeGet(logs[0], sType.key) || toNum(logs[0][`L7_${sType.key}`]);
      const prop=st.props.find(pr=>(pr.PLAYER_NAME||"").toLowerCase()===name.toLowerCase()&&pr.METRIC===sType.key);

      streaks.push({
        player:name,team:p.team_abbr||"",opp:p.opp_abbr_tonight||"",pitcher:"",hand:"",venue:p.venue_tonight||"",
        stat:sType.key,threshold:sType.threshold,streak,label:sType.label,emoji:sType.emoji,propType:sType.type,desc:sType.desc,isLte,
        avgDuring:(avgDuring||0).toFixed(2),seasAvg:(seasAvg||0).toFixed(2),recentVals,dkLine:prop?prop.DK_LINE:null,overOdds:prop?parseInt(prop.OVER_ODDS)||null:null,
      });
    }
  }

  const best={};
  for(const s of streaks){
    const k=`${s.player}|${s.stat}|${s.threshold}`;
    if(!best[k]||s.streak>best[k].streak)best[k]=s;
  }
  return Object.values(best).sort((a,b)=>b.streak-a.streak);
}

    <div class="sub-tabs" style="padding-top:12px">
      <div class="sub-tab ${st.picksView==="picks"?"active":""}" onclick="switchPicksView('picks')">🤖 Picks</div>
      <div class="sub-tab ${st.picksView==="draft"?"active":""}" onclick="switchPicksView('draft')">⚾ Draft</div>
      <div class="sub-tab ${st.picksView==="streaks"?"active":""}" onclick="switchPicksView('streaks')">🔥 Streaks</div>
      <div class="sub-tab ${st.picksView==="dingers"?"active":""}" onclick="switchPicksView('dingers')">💣 Dingers</div>
      <div class="sub-tab ${st.picksView==="props"?"active":""}" onclick="switchPicksView('props')">🎲 Props</div>
    </div>
    <div id="picksContent">${renderPicksTabContent()}</div>
  </div>

  <div class="page ${activeTab==="lookup"?"active":""}">
    ${st.lkPlayer ? `<div class="profile"><div class="profile-info"><h2>${st.lkPlayer.name}</h2><p>${st.lkPlayer.team} · ${st.lkPlayer.pos}</p></div></div>` : `<div class="empty">Search for a player above.</div>`}
  </div>

  <div class="tab-bar">
    <button class="tab-btn ${activeTab==="dashboard"?"active":""}" onclick="switchTab('dashboard')">📊 Dash</button>
    <button class="tab-btn ${activeTab==="picks"?"active":""}" onclick="switchTab('picks')">🎯 Picks</button>
    <button class="tab-btn ${activeTab==="lookup"?"active":""}" onclick="switchTab('lookup')">🔍 Lookup</button>
  </div>`;

  // Attach safe listeners
  const ms=document.getElementById("metricSel"); if(ms) ms.onchange=e=>{st.metric=e.target.value;render()};
  const li=document.getElementById("lineInput"); if(li) li.onchange=e=>{st.line=e.target.value;render()};
}

// ═══════════════════════════════════════════
// 📑 PICKS TAB ROUTER
// ═══════════════════════════════════════════
function renderPicksTabContent() {
  if (st.picksView === "draft") {
    const board = getDraftBoard();
    return `<div style="padding:12px 16px 4px;color:#4ade80;font-size:13px;font-weight:700">⚾ Draft Cheat Sheet</div>
      <div class="draft-controls"><button class="draft-reset" onclick="resetDrafted()">Reset Board</button></div>
      ${board.map((p,i)=>`<div class="draft-card ${st.drafted.has(p.name)?'drafted':''} ${p.isSmash&&!st.drafted.has(p.name)?'smash':''}" onclick="toggleDrafted('${esc(p.name)}')">
        <div class="draft-rank">${i+1}</div>
        <div class="draft-main">
          <div class="draft-name">${esc(p.name)} <span class="draft-pos">${p.pos}</span></div>
          <div class="draft-meta">${esc(p.team)} vs ${esc(p.opp)}</div>
        </div>
        <div class="draft-fp"><div class="draft-fp-val">${p.projUD}</div><div class="draft-fp-lbl">UD FP</div></div>
      </div>`).join("")}`;
  } 
  if (st.picksView === "dingers") {
    const db = getDingerBoard();
    return `<div class="dinger-header"><div class="dinger-title">💣 Tonight's Dinger Board</div></div>
      ${db.map((d,i)=>`<div class="dinger-card ${i<3?'top3':''}">
        <div class="dinger-left">
          <div><span class="dinger-rank">${i+1}</span><span class="dinger-name">${esc(d.name)}</span></div>
          <div class="dinger-meta">${esc(d.team)} vs ${esc(d.pitcher)}</div>
        </div>
        <div class="dinger-right">
          <div class="dinger-rate">${(d.hrRate*100).toFixed(1)}%</div>
          <div class="dinger-sub">HR Rate</div>
        </div>
      </div>`).join("")}`;
  }
  if (st.picksView === "streaks") {
    const streaks = getStreaks();
    return `<div class="streak-header"><div class="streak-title">🔥 Active Streaks</div></div>
      ${streaks.map(s=>`<div class="streak-card">
        <div class="streak-top">
          <div style="flex:1"><div><span class="streak-player">${esc(s.player)}</span><span class="streak-heat">${s.emoji} ${s.streak}</span></div><div class="streak-info">${esc(s.desc)}</div></div>
        </div>
      </div>`).join("")}`;
  }
  if (st.picksView === "props") {
    const allM = [...new Set(st.props.map(p=>p.METRIC).filter(Boolean))].sort();
    return `<div style="padding:8px 16px"><input type="text" id="propsSearchInput" placeholder="Search player..." value="${esc(st.propsSearch)}" oninput="filterPropsLocal()"/></div>
    <div class="props-filter"><div class="pf-btn ${st.propsMetric==="ALL"?"active":""}" onclick="setPropsMetric('ALL')">All</div>${allM.map(m=>`<div class="pf-btn ${st.propsMetric===m?"active":""}" onclick="setPropsMetric('${m}')">${m}</div>`).join("")}</div>
    <div style="padding:0 16px;color:#6b8f7b;font-size:10px;margin-bottom:4px" id="propsCountDiv">${st.props.length} props</div>
    <div class="props-tbl-wrap"><table><thead><tr><th>Player</th><th>Prop</th><th>Line</th><th>Over</th><th>Under</th></tr></thead><tbody id="propsTbody"></tbody></table></div>
    <script>setTimeout(filterPropsLocal, 50);<\/script>`;
  }
  // Default to AI picks
  return st.picks.length ? st.picks.map(pk=>`<div class="pick-card"><div><span class="pick-player">${esc(pk.player)}</span></div><div class="pick-prop"><div class="pick-type">${pk.prop_type}</div><div class="pick-lean">${pk.lean} ${pk.line}</div></div></div>`).join("") : `<div class="empty">No AI Picks</div>`;
}

// ═══════════════════════════════════════════
// 🚀 INIT
// ═══════════════════════════════════════════
Promise.all([
  fetchSheet("Tonights_Batters"), fetchSheet("Batter_Game_Logs"),
  fetchSheet("Home_Away_Splits").catch(()=>[]), fetchSheet("Venue_Weather").catch(()=>[]),
  fetchSheet("Tonights_Pitchers").catch(()=>[]), fetchSheet("Tonights_Schedule").catch(()=>[]),
  fetchSheet("Tonights_Starters").catch(()=>[]), fetchSheet("Pitcher_Game_Logs").catch(()=>[]),
  fetchSheet("Pitcher_Home_Away").catch(()=>[]), fetchSheet("Daily_Picks").catch(()=>[]),
  fetchSheet("DK_Player_Props").catch(()=>[])
]).then(d=>{
  st.tonight=cleanRows(d[0]); st.gameLogs=cleanRows(d[1]); st.splits=cleanRows(d[2]);
  st.weather=cleanRows(d[3]); st.pitchers=cleanRows(d[4]); st.schedule=cleanRows(d[5]);
  st.pTonight=cleanRows(d[6]); st.pGameLogs=cleanRows(d[7]); st.pSplits=cleanRows(d[8]);
  st.picks=cleanRows(d[9]); st.props=cleanRows(d[10]);
  st.loading=false;
  st.player=firstValidPlayer(st.tonight);
  if(!st.player&&st.pTonight.length>0){st.mode="pitcher";st.metric="SO";st.player=firstValidPlayer(st.pTonight);}
  render();
}).catch(e=>{st.loading=false;st.error="Failed to load Google Sheet.";render();});
</script>
</body>
</html>
